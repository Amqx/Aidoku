name: Build Nightly

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Aidoku/**"
      - "Aidoku.xcodeproj/**"
      - ".github/workflows/build.yaml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    runs-on: macos-26

    env:
      XCODE_VERSION: "26.6"
      DERIVED_DATA: build/DerivedData
      SOURCE_PACKAGES: build/SourcePackages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.SOURCE_PACKAGES }}
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ hashFiles('Aidoku.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DERIVED_DATA }}/Build
            ${{ env.DERIVED_DATA }}/ModuleCache.noindex
          key: deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Install iOS platform
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS

      - name: Install build tools
        run: |
          if ! command -v xcbeautify > /dev/null 2>&1; then
            brew install xcbeautify
          fi
          if ! command -v swiftlint > /dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project Aidoku.xcodeproj \
            -scheme Aidoku \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Aidoku.xcarchive \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            archive 2>&1 \
              | tee /tmp/aidoku-build.log \
              | xcbeautify --renderer github-actions; then
            grep -nE '(error|warning):|\*\* (BUILD|ARCHIVE) (FAILED|SUCCEEDED)' \
              /tmp/aidoku-build.log | tail -40 || true
            exit 1
          fi

          app=build/Aidoku.xcarchive/Products/Applications/Aidoku.app
          test -d "$app"
          stage="$RUNNER_TEMP/aidoku-ipa"
          mkdir -p "$stage/Payload"
          cp -R "$app" "$stage/Payload/"
          rm -rf "$stage/Payload/Aidoku.app/_CodeSignature"
          rm -f "$stage/Payload/Aidoku.app/embedded.mobileprovision"
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/build/Aidoku-nightly.ipa" Payload)

      - name: Publish nightly release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

          if gh release view nightly > /dev/null 2>&1; then
            gh release upload nightly build/Aidoku-nightly.ipa --clobber
            gh release edit nightly \
              --title "Aidoku Nightly" \
              --notes "Unsigned IPA built from commit $short_sha." \
              --prerelease
          else
            gh release create nightly build/Aidoku-nightly.ipa \
              --verify-tag \
              --title "Aidoku Nightly" \
              --notes "Unsigned IPA built from commit $short_sha." \
              --prerelease
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Aidoku-nightly-${{ github.sha }}
          path: build/Aidoku-nightly.ipa
          if-no-files-found: ignore
